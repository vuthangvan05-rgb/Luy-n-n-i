<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b3a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Luyện Nói">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Luyện Nói Hằng Ngày</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one narrow app column; tabs on top for desktop, bottom bar on phone. Highlighter-yellow marks what you said right. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#e3e8ee; --fg:#14202e; --muted:#5a6878; --line:#d3dae2;
  --ink:#1b3a5c; --mark:#ffd84d; --mark-fg:#14202e;
  --good:#1f8a5b; --good-bg:#dff3e9; --bad:#c23b3b; --bad-bg:#fbe3e3; --warn:#a86a00;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161e; --surface:#17212c; --sunk:#1f2b38; --fg:#e7edf3; --muted:#9aa9b8; --line:#2a3846;
  --ink:#9cc3ec; --mark:#f2c94c; --mark-fg:#14202e;
  --good:#5fd39b; --good-bg:#16362a; --bad:#f08080; --bad-bg:#3a1d1f; --warn:#f0b54a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161e; --surface:#17212c; --sunk:#1f2b38; --fg:#e7edf3; --muted:#9aa9b8; --line:#2a3846;
  --ink:#9cc3ec; --mark:#f2c94c; --mark-fg:#14202e;
  --good:#5fd39b; --good-bg:#16362a; --bad:#f08080; --bad-bg:#3a1d1f; --warn:#f0b54a; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 4px}
.brand{font-weight:800;font-size:1.15rem;letter-spacing:-.01em;color:var(--ink)}
.brand span{background:var(--mark);color:var(--mark-fg);padding:0 .3em;border-radius:4px;margin-left:2px}
.streak{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);display:flex;gap:12px}
.streak b{color:var(--fg)}
.brand,.streak span{white-space:nowrap}
@media (max-width:420px){.brand{font-size:1rem}.streak{gap:8px;font-size:.78rem}}
nav.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;margin-block:10px 18px}
nav.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:600 .9rem var(--f-body);padding:8px 6px;border-radius:999px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:20px;height:20px}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
@media (max-width:640px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;border-radius:0;border-width:1px 0 0;z-index:20;
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav.tabs button{font-size:.72rem;border-radius:10px}
}
h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:800}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 .92rem var(--f-body);padding:9px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink)}
form.row .btn{white-space:nowrap;flex:none}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.mark{background:var(--mark);color:var(--mark-fg);border-color:var(--mark)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
textarea{resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat .v{font:600 1.5rem var(--f-mono);font-variant-numeric:tabular-nums}
.goalbar{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.goalbar i{display:block;height:100%;background:var(--mark);border-radius:99px;transition:width .4s}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plan li{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.plan li:hover{border-color:var(--ink)}
.plan .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.plan li.done .chk{background:var(--good);border-color:var(--good);color:#fff}
.plan li.done .t{text-decoration:line-through;color:var(--muted)}
.plan .t{flex:1;min-width:0}
.phrase{font-size:1.45rem;font-weight:700;line-height:1.3}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:280px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--sunk);max-width:100%}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--mark) 35%,var(--sunk))}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--mark) 65%,var(--sunk))}
.heat i[data-l="3"]{background:var(--mark)}
.heat i.today{outline:2px solid var(--ink)}
/* flashcard */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 20px;min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px}
.card .en{font-size:1.6rem;font-weight:700;line-height:1.25}
.card .vi{font-size:1.1rem;color:var(--ink);font-weight:600}
.card .ex{color:var(--muted);font-style:italic;max-width:46ch}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate .btn{flex-direction:column;justify-content:center;gap:0;padding:10px 4px}
.rate .btn small{font:400 .72rem var(--f-mono);color:var(--muted)}
.rate .again{border-color:var(--bad);color:var(--bad)}
.rate .good{border-color:var(--good);color:var(--good)}
.topics{display:flex;gap:6px;flex-wrap:wrap}
.topics button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px;font:500 .85rem var(--f-body);cursor:pointer}
.topics button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
/* shadowing */
.target{font-size:1.35rem;font-weight:700;line-height:1.5}
.target .w{padding:0 2px;border-radius:4px}
.target .w.ok{background:var(--mark);color:var(--mark-fg)}
.target .w.miss{text-decoration:underline wavy var(--bad);text-underline-offset:5px}
.ipa{font-family:var(--f-mono);color:var(--muted);font-size:.9rem}
.heard{font-family:var(--f-mono);font-size:.92rem;background:var(--sunk);padding:10px 12px;border-radius:10px;min-height:44px}
.score{font:600 2.4rem var(--f-mono);font-variant-numeric:tabular-nums;line-height:1}
.mic{width:72px;height:72px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.mic svg{width:30px;height:30px}
.mic.on{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 55%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}.goalbar i{transition:none}}
.tip{border-left:3px solid var(--mark);padding:6px 12px;background:var(--sunk);border-radius:0 8px 8px 0;font-size:.9rem}
.list{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.list button{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit;display:flex;gap:8px;justify-content:space-between;align-items:center}
.list button[aria-current="true"]{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
/* chat */
.scen{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.scen button{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r);padding:14px;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:4px}
.scen button:hover{border-color:var(--ink)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow:auto;padding:4px}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;line-height:1.45}
.msg.ai{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--ink);color:var(--surface);align-self:flex-end;border-bottom-right-radius:4px}
.fb{align-self:flex-end;max-width:85%;font-size:.86rem;background:var(--sunk);border-radius:10px;padding:8px 12px}
.fb b{color:var(--good)}
.fb .fix{color:var(--warn);font-weight:600}
.compose{display:flex;gap:8px;align-items:flex-end}
.compose textarea{flex:1;min-height:44px;max-height:120px}
.compose .mic{width:46px;height:46px}
.compose .mic svg{width:22px;height:22px}
.mode{font-size:.8rem}
.iconbtn{border:0;background:transparent;color:var(--ink);cursor:pointer;padding:4px;display:inline-grid;place-items:center;border-radius:6px}
.iconbtn svg{width:20px;height:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:50;pointer-events:none}
table.mini{width:100%;border-collapse:collapse;font-size:.9rem}
table.mini td{padding:6px 4px;border-bottom:1px solid var(--line)}
table.mini td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.src{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.src div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.src b{display:block}
.photo{max-width:100%;max-height:260px;object-fit:contain;border-radius:var(--r);border:1px solid var(--line);align-self:flex-start}
.call{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-block:24px}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font:800 2rem var(--f-body)}
.callLine{font-size:1.25rem;font-weight:600;line-height:1.4;max-width:34ch}
.mic.big{width:96px;height:96px}.mic.big svg{width:40px;height:40px}
.mic:disabled{opacity:.4;cursor:not-allowed}
.hero{background:var(--ink);color:var(--surface);border-radius:16px;padding:18px;gap:12px}
.btn.big{justify-content:center;padding:14px;font-size:1.05rem}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q{text-align:left;border:1px solid color-mix(in srgb,var(--surface) 25%,transparent);background:color-mix(in srgb,var(--surface) 10%,transparent);color:inherit;border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:2px;min-width:0}
.q .label{color:inherit;opacity:.75}.q b{font-size:.9rem;line-height:1.3}
.q:hover{background:color-mix(in srgb,var(--surface) 18%,transparent)}
.msg .tools{display:flex;align-items:center;gap:2px;margin-top:4px}
.tr{border:0;background:var(--sunk);color:var(--ink);font:600 .75rem var(--f-body);padding:3px 9px;border-radius:99px;cursor:pointer;margin-left:4px}
.vi-tr{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);color:var(--muted);font-size:.9rem}
.typing{display:flex;gap:4px;align-items:center;padding:14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}}
/* learning modes */
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (max-width:520px){.modes{gap:10px}}
.mode-card{text-align:left;border:0;background:transparent;color:var(--fg);padding:0;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:4px;min-width:0}
.mode-card .art{position:relative;border-radius:16px;aspect-ratio:16/10;display:grid;place-items:center;transition:transform .15s;max-width:100%}
.mode-card:hover .art{transform:translateY(-2px)}
.mode-card .art svg{width:62%;height:auto;fill:var(--surface);stroke:var(--fg);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.mode-card .art .f2{fill:var(--mark)}.mode-card .art .dot{fill:var(--fg);stroke:none}.mode-card .art .ln{fill:none}.mode-card .art .ln2{fill:none;stroke-width:2.6}
.mode-card .art .pill{position:absolute;top:8px;right:8px}
.mode-card b{font-size:1rem;margin-top:4px}
.c-y{background:var(--mark)}.c-y .f2{fill:var(--surface)!important}
.c-b{background:color-mix(in srgb,var(--ink) 22%,var(--surface))}.c-g{background:color-mix(in srgb,var(--good) 22%,var(--surface))}
.c-p{background:color-mix(in srgb,#7a5cff 22%,var(--surface))}.c-o{background:color-mix(in srgb,#ff8a3d 24%,var(--surface))}.c-t{background:color-mix(in srgb,#14a3b8 22%,var(--surface))}
.prog{display:flex;align-items:center}.prog span{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 10px;font:600 .9rem var(--f-mono);z-index:1;min-width:56px;text-align:center}
.prog div{flex:1;height:8px;background:color-mix(in srgb,var(--ink) 18%,var(--sunk));border-radius:0 99px 99px 0;margin-left:-4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ink)}
.lno{color:var(--ink);font-weight:700;font-size:.9rem}
.path{display:flex;flex-direction:column;gap:8px}
.lesson{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:16px;padding:12px 14px;cursor:pointer;font:inherit}
.lesson:hover{border-color:var(--ink)}.lesson .t{flex:1;display:flex;flex-direction:column;min-width:0}
.ring{--p:0;width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--good) calc(var(--p)*1%),var(--sunk) 0)}
.ring span{width:38px;height:38px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;color:var(--ink)}
.wbox{border:1.5px solid color-mix(in srgb,var(--ink) 40%,var(--line));border-radius:16px;padding:12px;margin:0;min-width:0}
.wbox legend{padding:0 6px;font-weight:700}.pillno{background:var(--ink);color:var(--surface);padding:3px 12px;border-radius:99px;margin-right:4px}
.wgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (max-width:600px){.wgrid{grid-template-columns:repeat(4,1fr);gap:6px}.wt{aspect-ratio:1;font-size:.72rem}}
.wt{aspect-ratio:1.1;border:1px solid color-mix(in srgb,var(--ink) 30%,var(--line));background:var(--bg);border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--fg);font:600 .82rem var(--f-body);padding:4px;min-width:0;overflow-wrap:anywhere;max-width:100%}
.wt .star{width:28px;height:28px;fill:color-mix(in srgb,var(--ink) 55%,var(--surface))}
.wt.done{background:var(--good-bg);border-color:var(--good);color:var(--good)}.wt.sel{outline:3px solid var(--mark);outline-offset:1px}
.wcard{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
/* chat header & chips */
.chead{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.chead .who{flex:1;min-width:0;display:flex;flex-direction:column}.chead .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{position:relative;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:800;flex:none}
.online{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#3ccf6e;border:2px solid var(--surface)}
.iconbtn.on{background:var(--ink);color:var(--surface)}
.chips{display:flex;flex-direction:column;align-items:flex-end;gap:8px;margin-top:4px}
.chip{border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:99px;padding:7px 14px;font:600 .9rem var(--f-body);cursor:pointer;text-align:right;max-width:85%}
.chip:hover{background:var(--ink);color:var(--surface)}
.rtxt{display:flex;flex-wrap:wrap;gap:4px 6px}
.rw{font:inherit;color:inherit;background:none;border:0;padding:1px 4px;border-radius:6px;cursor:pointer;border-bottom:2px dotted var(--line)}
.rw:hover{background:var(--line)}
.rw.rk{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);border-bottom-color:var(--good)}
.rw.rb{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad);border-bottom-color:var(--bad)}
.rw.rg{color:var(--muted);text-decoration:line-through;border-bottom-color:var(--muted)}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.lg.rk{background:var(--good)}.lg.rb{background:var(--bad)}.lg.rg{background:var(--muted)}
.strs{color:var(--bad)}
.hintf{letter-spacing:1px;font-family:var(--f-mono,monospace)}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sg .btn{justify-content:center;padding-inline:6px}
.sg2{border-color:var(--good);color:var(--good)}.sg1{border-color:var(--warn);color:var(--warn)}.sg0{border-color:var(--bad);color:var(--bad)}
@media (max-width:640px){.dact{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--surface);padding:8px 0;box-shadow:0 -8px 12px -8px rgba(0,0,0,.15)}}

.phtab{padding:6px 10px}.phr{display:grid;grid-template-columns:22px 1fr 1fr 32px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}.phr:last-child{border-bottom:0}
.phh{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}.phn{color:var(--muted);font-size:.75rem}.phc.en{font-weight:700;color:var(--ink)}
.phc.hid{background:var(--sunk);color:var(--muted);border-radius:8px;padding:6px;font-size:.78rem;font-weight:500;cursor:pointer;text-align:center}
.iconbtn.sm{width:32px;height:32px}.iconbtn.sm svg{width:16px;height:16px}

/niːs/","cháu gái","Dùng khi nói về con gái của anh/chị/em ruột.","A2"],["grandparent","/ˈɡrænˌpɛrənt/","ông bà","Dùng để chỉ ông nội/ngoại hoặc bà nội/ngoại.","A2"],["grandfather","/ˈɡrændˌfɑːðər/","ông","Dùng khi nói về ông nội hoặc ông ngoại.","A1"],["grandmother","/ˈɡrænˌmʌðər/","bà","Dùng khi nói về bà nội hoặc bà ngoại.","A1"],["grandchild","/ˈɡrænˌtʃaɪld/","cháu nội/cháu ngoại","Dùng khi nói chung về cháu của ông bà.","B1"],["in-laws","/ɪn lɔːz/","gia đình bên chồng/vợ","Dùng khi nói về các thành viên gia đình của vợ hoặc chồng.","B1"],["stepfather","/ˈstɛpˌfɑːðər/","cha dượng","Dùng khi nói về người cha không phải ruột thịt nhưng kết hôn với mẹ.","B1"],["stepmother","/ˈstɛpˌmʌðər/","mẹ kế","Dùng để chỉ người vợ mới của bố, không phải mẹ ruột.","B1"],["half-brother","/ˈhæf ˌbrʌðər/","anh em cùng cha khác mẹ/cùng mẹ khác cha","Dùng khi có cùng một người cha hoặc một người mẹ nhưng không cùng cả hai.","B2"],["half-sister","/ˈhæf ˌsɪstər/","chị em cùng cha khác mẹ/cùng mẹ khác cha","Dùng để chỉ chị em ruột có cùng một cha hoặc một mẹ.","B2"],["extended family","/ɪkˈstɛndɪd ˈfæmɪli/","đại gia đình","Dùng để nói về gia đình lớn bao gồm họ hàng.","B2"],["household","/ˈhaʊsˌhoʊld/","hộ gia đình","Dùng để chỉ những người sống chung một nhà.","C1"],["ancestry","/ˈænsɛstri/","dòng dõi, tổ tiên","Dùng khi nghiên cứu hoặc nói về nguồn gốc tổ tiên.","C1"],["matriarch","/ˈmeɪtriˌɑrk/","nữ chủ gia đình","Dùng khi nói về người phụ nữ đứng đầu gia đình.","C2"],["grandparents","/ˈɡrænperənts/","ông bà","Nói chung về ông và bà.","A1",1],["twin","/twɪn/","sinh đôi","Hai anh chị em sinh cùng lúc.","A2",1],["only child","/ˈoʊnli tʃaɪld/","con một","Người không có anh chị em.","A2",1],["get along with","/ɡet əˈlɔːŋ wɪð/","hòa hợp với","Nói về mối quan hệ tốt với ai.","B1",1],["take after","/teɪk ˈæftər/","giống (bố/mẹ)","Giống người lớn tuổi trong gia đình về tính cách/ngoại hình.","B1",1],["bring up","/brɪŋ ʌp/","nuôi dạy","Nói về việc nuôi con.","B1",1],["close-knit","/ˌkloʊs ˈnɪt/","gắn bó khăng khít","Mô tả gia đình thân thiết.","B2",1],["generation gap","/ˌdʒenəˈreɪʃn ɡæp/","khoảng cách thế hệ","Khác biệt suy nghĩ giữa các thế hệ.","B2",1]]},{"t":"Bạn bè và giao tiếp xã hội","w":[["friend","/frɛnd/","bạn bè","Dùng để chỉ một người mình quen biết và có mối quan hệ thân thiết.","A1"],["classmate","/ˈklæsmeɪt/","bạn cùng lớp","Khi nói về những người học chung lớp.","A1"],["neighbor","/ˈneɪbər/","hàng xóm","Khi nói về người sống gần nhà mình.","A1"],["teammate","/ˈtiːm.meɪt/","đồng đội","Khi nói về người cùng trong một đội thể thao hoặc làm việc nhóm.","A1"],["group","/ɡruːp/","nhóm","Khi chỉ một tập thể người có chung sở thích hoặc hoạt động chung.","A1"],["colleague","/ˈkɒliːɡ/","đồng nghiệp","Khi nói về những người làm chung công ty hoặc tổ chức.","A2"],["acquaintance","/əˈkweɪntəns/","người quen","Khi muốn nói về người mình biết nhưng không thân thiết.","A2"],["best friend","/bɛst frɛnd/","bạn thân nhất","Khi muốn chỉ người bạn thân thiết nhất với mình.","A2"],["chit-chat","/ˈtʃɪtʃæt/","cuộc trò chuyện phiếm","Khi nói về những cuộc trò chuyện ngắn không quá nghiêm túc.","A2"],["small talk","/smɔːl tɔːk/","chuyện phiếm xã giao","Khi nói về những cuộc hội thoại ngắn trong các sự kiện xã hội.","B1"],["companion","/kəmˈpænjən/","bạn đồng hành","Khi nói về người cùng đi du lịch, làm việc hoặc sống chung.","B1"],["mentor","/ˈmɛntɔːr/","người cố vấn","Khi nói về ai đó có kinh nghiệm hướng dẫn và giúp đỡ mình.","B1"],["networking","/ˈnɛtˌwɜrkɪŋ/","xây dựng quan hệ","Khi nói về việc kết nối với nhiều người vì mục tiêu công việc hoặc xã hội.","B2"],["peer","/pɪər/","bạn đồng trang lứa","Khi muốn nói về người có cùng độ tuổi, cấp bậc hoặc hoàn cảnh.","B2"],["banter","/ˈbæn.tər/","cuộc nói chuyện vui vẻ, trêu đùa","Khi nói về những cuộc trò chuyện nhẹ nhàng, vui vẻ, có sự trêu ghẹo giữa bạn bè.","B2"],["bond","/bɒnd/","mối quan hệ gắn kết","Khi muốn diễn tả sự kết nối sâu sắc giữa bạn bè hoặc gia đình.","B2"],["acquaintance network","/əˈkweɪntəns ˈnɛtwɜrk/","mạng lưới người quen","Khi muốn nói về những mối quan hệ xã hội không quá thân thiết nhưng có lợi ích trong công việc.","B2"],["extrovert","/ˈɛkstrəˌvɜːrt/","người hướng ngoại","Khi muốn mô tả người thích giao tiếp và gặp gỡ người khác.","C1"],["introvert","/ˈɪntrəˌvɜːrt/","người hướng nội","Khi nói về người thích sự riêng tư và không thích giao tiếp quá nhiều.","C1"],["social circle","/ˈsoʊʃəl ˈsɜːrkəl/","vòng tròn quan hệ","Khi muốn nói về nhóm người quen biết và thường xuyên giao tiếp với nhau.","C1"],["rapport","/ræˈpɔːr/","sự hòa hợp","Khi muốn nói về sự kết nối và hiểu nhau giữa hai người.","C1"],["bromance","/ˈbroʊ.mæns/","tình bạn thân thiết giữa nam giới","Khi nói về tình bạn thân thiết giữa hai người đàn ông.","C1"],["sisterhood","/ˈsɪs.tɚ.hʊd/","tình chị em thân thiết","Khi nói về sự gắn bó giữa những người phụ nữ.","C1"],["deep conversation","/diːp ˌkɒnvərˈseɪʃən/","cuộc trò chuyện sâu sắc","Khi muốn nói về những cuộc trò chuyện có ý nghĩa, bàn luận về cảm xúc hoặc triết lý sống.","C1"],["long-lost friend","/lɒŋ lɒst frɛnd/","bạn lâu năm không gặp","Khi nhắc đến một người bạn cũ đã lâu không liên lạc nhưng giờ gặp lại.","C1"],["diplomacy","/dɪˈploʊməsi/","sự khéo léo trong giao tiếp","Khi nói về khả năng xử lý tình huống xã hội một cách tinh tế.","C2"],["clique","/kliːk/","nhóm bạn thân thiết","Khi muốn nói về một nhóm nhỏ thân thiết, thường không mở rộng ra người ngoài.","C2"],["camaraderie","/ˌkæməˈrɑːdəri/","tình bạn thân thiết","Khi muốn mô tả sự gắn bó, đồng hành giữa bạn bè hoặc đồng nghiệp.","C2"],["confidant","/ˈkɒnfɪdænt/","người tri kỷ, tâm giao","Khi nói về một người mà mình tin tưởng, chia sẻ bí mật hoặc tâm sự.","C2"],["soulmate","/ˈsoʊl.meɪt/","tri kỷ","Khi muốn nói về một người có sự kết nối sâu sắc với mình.","C2"],["hang out","/hæŋ aʊt/","đi chơi","Dành thời gian vui chơi với bạn bè.","A2",1],["invite","/ɪnˈvaɪt/","mời","Mời ai đó đến dự sự kiện.","A2",1],["party","/ˈpɑːrti/","bữa tiệc","Sự kiện vui chơi cùng bạn bè.","A1",1],[ ate","/ɪˈvækjʊeɪt/","Di tản","Dùng khi nói về hành động sơ tán người dân trong trường hợp nguy hiểm.","B1"],["Siren","/ˈsaɪrən/","Còi báo động","Dùng khi nói về tiếng còi báo động trong các tình huống khẩn cấp.","B1"],["Hazard","/ˈhæzəd/","Mối nguy hiểm","Dùng khi nói về một yếu tố nguy hiểm trong môi trường.","B1"],["Alert","/əˈlɜːt/","Cảnh báo","Dùng khi nói về trạng thái sẵn sàng và cảnh giác đối với nguy hiểm.","B1"],["Fire extinguisher","/ˈfaɪə ɪksˈtɪŋɡwɪʃə/","Bình chữa cháy","Dùng khi nói về thiết bị dùng để dập tắt lửa.","B1"],["Lifeline","/ˈlaɪflaɪn/","Dây cứu sinh","Dùng khi nói về vật dụng hoặc biện pháp cứu người trong tình huống nguy hiểm.","B2"],["CPR (Cardiopulmonary Resuscitation)","/ˌsɪˈpiːˈɑːr/","Hồi sức tim phổi","Dùng khi nói về kỹ thuật sơ cứu để hồi sinh người bị ngừng tim.","B2"],["Hazardous","/ˈhæzədəs/","Nguy hiểm","Dùng khi nói về điều gì đó có thể gây hại hoặc nguy hiểm.","B2"],["Search and rescue","/sɜːʧ ənd ˈrɛskjuː/","Tìm kiếm và cứu nạn","Dùng khi nói về các hoạt động tìm kiếm và cứu hộ người mất tích.","B2"],["Earthquake","/ˈɜːθkweɪk/","Động đất","Dùng khi nói về hiện tượng địa chấn dưới lòng đất.","B2"],["Flood","/flʌd/","Lũ","Dùng khi nói về tình trạng ngập nước do mưa lớn hoặc vỡ đập.","B2"],["Storm","/stɔːm/","Bão","Dùng khi nói về hiện tượng thời tiết mạnh mẽ với gió mạnh và mưa lớn.","B2"],["Tornado","/tɔːˈneɪdəʊ/","Lốc xoáy","Dùng khi nói về hiện tượng thời tiết có gió mạnh xoáy thành hình ống.","B2"],["Emergency services","/ɪˈmɜːdʒənsi ˈsɜːvɪsɪz/","Dịch vụ khẩn cấp","Dùng khi nói về các dịch vụ y tế, cứu hộ, cứu hỏa trong trường hợp khẩn cấp.","B2"],["Ambulance","/ˈæmbjʊləns/","Xe cứu thương","Dùng khi nói về phương tiện di chuyển để cấp cứu bệnh nhân.","B2"],["Safety gear","/ˈseɪfti ɡɪə/","Trang thiết bị bảo hộ","Dùng khi nói về các dụng cụ bảo vệ trong môi trường nguy hiểm.","B2"],["Fire drill","/ˈfaɪə drɪl/","Tập huấn phòng cháy chữa cháy","Dùng khi nói về buổi diễn tập phòng cháy chữa cháy.","B2"],["Emergency exit","/ɪˈmɜːdʒənsi ˈɛksɪt/","Cửa thoát hiểm","Dùng khi nói về lối thoát ra ngoài khi có sự cố.","B2"],["Fire alarm","/ˈfaɪə əˈlɑːm/","Báo cháy","Dùng khi nói về hệ thống cảnh báo cháy.","B2"],["Safety protocol","/ˈseɪfti ˈprəʊtəkɒl/","Quy trình an toàn","Dùng khi nói về các quy trình cần tuân thủ để đảm bảo an toàn.","B2"],["Evacuation plan","/ɪˌvækjʊˈeɪʃən plæn/","Kế hoạch di tản","Dùng khi nói về kế hoạch rút lui hoặc sơ tán trong trường hợp khẩn cấp.","C1"],["Disaster management","/dɪˈzɑːstə ˈmænɪdʒmənt/","Quản lý thảm họa","Dùng khi nói về việc điều phối và ứng phó với các thảm họa thiên nhiên.","C1"],["Contingency plan","/kənˈtɪndʒənsi plæn/","Kế hoạch dự phòng","Dùng khi nói về kế hoạch ứng phó với tình huống bất ngờ.","C1"],["Emergency response","/ɪˈmɜːdʒənsi rɪˈspɒns/","Phản ứng khẩn cấp","Dùng khi nói về hành động nhanh chóng trong tình huống khẩn cấp.","C2"],["help","/help/","cứu với; giúp đỡ","Kêu cứu khi gặp nguy hiểm.","A1",1],["accident","/ˈæksɪdənt/","tai nạn","Sự cố gây thương tích.","A2",1],["injured","/ˈɪndʒərd/","bị thương","Bị tổn thương cơ thể.","B1",1],["lost","/lɔːst/","bị lạc; bị mất","Không tìm được đường hoặc đồ vật.","A2",1],["stolen","/ˈstoʊlən/","bị đánh cắp","Đồ bị lấy trộm.","B1",1],["call the police","/kɔːl ðə pəˈliːs/","gọi cảnh sát","Báo cảnh sát khi gặp chuyện.","A2",1],["Watch out!","/wɑːtʃ aʊt/","Cẩn thận!","Cảnh báo nguy hiểm ngay lập tức.","A2",1],["safety belt","/ˈseɪfti belt/","dây an toàn","Thắt khi đi ô tô.","A2",1],["helmet","/ˈhelmɪt/","mũ bảo hiểm","Đội khi đi xe máy.","A2",1]]},{"t":"Giao tiếp qua Email và tin nhắn","w":[["Email","/ˈiːmeɪl/","Thư điện tử","Dùng khi nói về hình thức gửi thư qua Internet.","A1"],["Message","/ˈmɛsɪdʒ/","Tin nhắn","Dùng khi nói về thông điệp gửi qua điện thoại hoặc email.","A1"],["Attach","/əˈtætʃ/","Đính kèm","Dùng khi nói về việc gửi tài liệu kèm theo email.","A2"],["Subject","/ˈsʌbdʒɪkt/","Chủ đề","Dùng khi nói về tiêu đề của email hoặc tin nhắn.","A2"],["Reply","/rɪˈplaɪ/","Trả lời","Dùng khi trả lời một email hoặc tin nhắn.","A2"],["Forward","/ˈfɔːwəd/","Chuyển tiếp","Dùng khi chuyển tiếp một email cho người khác.","A2"],["Recipient","/rɪˈsɪpɪənt/","Người nhận","Dùng khi nói về người nhận email hoặc tin nhắn.","B1"],["Inbox","/ˈɪnbɒks/","Hộp thư đến","Dùng khi nói về nơi nhận thư hoặc tin nhắn.","B1"],["Spam","/spæm/","Thư rác","Dùng khi nói về email không mong muốn hoặc quảng cáo.","B1"],["Signature","/ˈsɪɡnətʃər/","Chữ ký","Dùng khi nói về thông tin được thêm vào cuối email, như tên và chức danh.","B1"],["Notification","/ˌnəʊtɪfɪˈkeɪʃən/","Thông báo","Dùng khi nói về thông báo qua email hoặc tin nhắn.","B1"],["Attachment","/əˈtætʃmənt/","Tệp đính kèm","Dùng khi nói về tài liệu được gửi kèm trong email.","B1"],["Formal","/ˈfɔːməl/","Chính thức","Dùng khi nói về phong cách viết email lịch sự, trang trọng.","B2"],["Informal","/ɪnˈfɔːməl/","Không chính thức","Dùng khi nói về phong cách viết email thân mật, không trang trọng.","B2"],["Clarify","/ˈklærɪfaɪ/","Làm rõ","Dùng khi muốn yêu cầu giải thích hoặc làm rõ thông tin trong email.","B2"],["Deadline","/ˈdɛdlaɪn/","Hạn chót","Dùng khi nói về thời gian cuối cùng để hoàn thành công việc hoặc gửi email.","B2"],["Confirmation","/ˌkɒnfəˈmeɪʃən/","Xác nhận","Dùng khi gửi thông báo xác nhận thông tin qua email.","B2"],["Query","/ˈkwɪəri/","Câu hỏi","Dùng khi yêu cầu thông tin hoặc sự giải thích qua email.","B2"],["Response","/rɪˈspɒns/","Phản hồi","Dùng khi nói về việc trả lời một email hoặc tin nhắn.","B2"],["Attachments","/əˈtætʃmənts/","Các tệp đính kèm","Dùng khi nói về nhiều tệp đính kèm trong một email.","B2"],["CC (Carbon Copy)","/ˈsiːˈsiː/","Bản sao","Dùng khi gửi email đến nhiều người và muốn họ thấy ai là người nhận chính.","B2"],["BCC (Blind Carbon Copy)","/ˈbiːˈsiːˈsiː/","Bản sao ẩn","Dùng khi gửi email đến nhiều người mà không để lộ người nhận.","B2"],["Acknowledgement","/əkˈnɒlɪdʒmənt/","Sự thừa nhận","Dùng khi xác nhận đã nhận được email hoặc thông tin.","B2"],["Priority","/praɪˈɒrəti/","Ưu tiên","Dùng khi nói về độ quan trọng của email cần xử lý trước.","B2"],["Query","/ˈkwɪəri/","Thắc mắc","Dùng khi hỏi một câu hỏi qua email hoặc tin nhắn.","C1"],["Disclaimer","/dɪsˈkleɪmə/","Cảnh báo","Dùng khi thông báo về những điều khoản hoặc thông tin không chịu trách nhiệm qua email.","C1"],["Enquiry","/ɪnˈkwaɪəri/","Yêu cầu thông tin","Dùng khi yêu cầu thông tin về sản phẩm, dịch vụ qua email.","C1"],["Respondent","/rɪˈspɒndənt/","Người trả lời","Dùng khi nói về người trả lời câu hỏi trong cuộc khảo sát hoặc email.","C1"],["Out of office","/aʊt ɒv ˈɒfɪs/","Ngoài văn phòng","Dùng khi thông báo bạn không có mặt tại văn phòng và không thể trả lời email ngay.","C1"],["Follow up","/ˈfɒləʊ ʌp/","Theo dõi","Dùng khi muốn tiếp tục một cuộc trao đổi email hoặc thông tin trước đó.","C2"],["email address","/ˈiːmeɪl əˌdres/","địa chỉ email","Địa chỉ nhận thư điện tử.","A1",1],["Dear…","/dɪr/","Kính gửi…","Lời mở đầu email.","A2",1],["Best regards","/best rɪˈɡɑːrdz/","Trân trọng","Lời kết email lịch sự.","B1",1],["I look forward to hearing from you","/aɪ lʊk ˈfɔːrwərd tuː ˈhɪrɪŋ frəm juː/","Mong nhận được phản hồi của bạn","Câu kết email trang trọng.","B1",1],["ASAP","/ˌeɪ es eɪ ˈpiː/","càng sớm càng tốt","Viết tắt của as soon as possible.","B1",1],["typo","/ˈtaɪpoʊ/","lỗi đánh máy","Lỗi gõ sai chữ.","B2",1]]},{"t":"Đàm phán và thương lượng","w":[["Bargain","/ˈbɑːɡɪn/","Thỏa thuận","Dùng khi nói về việc thương lượng để có được điều kiện tốt hơn.","A1"],["Agreement","/əˈɡriːmənt/","Thỏa thuận","Dùng khi nói về sự đồng ý về các điều kiện trong cuộc đàm phán.","A1"],["Deal","/diːl/","Giao dịch","Dùng khi nói về các thỏa thuận, đặc biệt trong kinh doanh.","A1"],["Proposal","/prəˈpəʊzl/","Đề xuất","Dùng khi nói về một kế hoạch hoặc ý tưởng được đưa ra để thảo luận.","A2"],["Counteroffer","/ˈkaʊntərˌɒfər/","Đề nghị phản hồi","Dùng khi nói về một đề xuất trái ngược với đề xuất ban đầu.","B1"],["Negotiator","/nɪˈɡəʊʃieɪtə/","Người đàm phán","Dùng khi nói về người tham gia vào cuộc đàm phán.","B1"],["Consensus","/kənˈsɛnsəs/","Sự đồng thuận","Dùng khi nói về sự đồng ý chung giữa các bên trong cuộc đàm phán.","B1"],["Terms","/tɜːmz/","Điều khoản","Dùng khi nói về các điều kiện hoặc quy tắc trong hợp đồng hoặc thỏa thuận.","B1"],["Concession","/kənˈsɛʃən/","Nhượng bộ","Dùng khi nói về hành động nhượng bộ trong cuộc đàm phán.","B1"],["Settlement","/ˈsɛtəlmənt/","Giải quyết","Dùng khi nói về việc đạt được thỏa thuận cuối cùng.","B1"],["Compromise","/ˈkɒmprəmaɪz/","Thỏa hiệp","Dùng khi nói về việc đạt được sự đồng thuận thông qua nhượng bộ.","B1"],["Mediation","/ˌmiːdɪˈeɪʃən/","Hòa giải","Dùng khi nói về việc dùng bên thứ ba để giải quyết tranh chấp.","B2"],["Contract","/ˈkɒntrækt/","Hợp đồng","Dùng khi nói về tài liệu chính thức ghi lại các điều kiện của thỏa thuận.","B2"],["Bargaining power","/ˈbɑːɡɪnɪŋ ˈpaʊə/","Sức mạnh đàm phán","Dùng khi nói về khả năng tạo ra ảnh hưởng trong cuộc đàm phán.","B2"],["Agreement in principle","/əˈɡriːmənt ɪn ˈprɪnsəpl/","Thỏa thuận nguyên tắc","Dùng khi nói về sự đồng ý sơ bộ trước khi đi vào chi tiết.","B2"],["Terms of reference","/tɜːmz əv ˈrɛfərəns/","Điều khoản tham chiếu","Dùng khi nói về các điều khoản được đưa ra trong đàm phán hoặc hợp đồng.","B2"],["Final offer","/ˈfaɪnəl ˈɒfə/","Đề nghị cuối cùng","Dùng khi nói về đề nghị cuối cùng trong cuộc đàm phán.","B2"],["Stipulate","/ˈstɪpjʊleɪt/","Quy định","Dùng khi nói về việc xác định rõ điều kiện trong hợp đồng hoặc thỏa thuận.","B2"],["Binding agreement","/ˈbaɪndɪŋ əˈɡriːmənt/","Thỏa thuận có tính ràng buộc","Dùng khi nói về thỏa thuận có hiệu lực pháp lý.","C1"],["Settlement agreement","/ˈsɛtəlmənt əˈɡriːmənt/","Thỏa thuận giải quyết","Dùng khi nói về thỏa thuận đạt được sau khi đàm phán để giải quyết tranh chấp.","C1"],["Negotiation skills","/nɪˌɡəʊʃɪˈeɪʃən skɪlz/","Kỹ năng đàm phán","Dùng khi nói về khả năng tham gia và thực hiện đàm phán hiệu quả.","C1"],["Terms and conditions","/tɜːmz ənd kənˈdɪʃənz/","Điều khoản và điều kiện","Dùng khi nói về các yêu cầu và quy định trong một hợp đồng.","C1"],["Win-win situation","/wɪn wɪn ˌsɪtʃuˈeɪʃən/","Tình huống đôi bên cùng có lợi","Dùng khi nói về một kết quả đàm phán mà tất cả các bên đều hài lòng.","C1"],["Trade-off","/ˈtreɪd ɒf/","Sự đánh đổi","Dùng khi nói về việc phải hy sinh một điều gì đó để có được điều khác.","C1"],["Resolution","/ˌrɛzəˈluːʃən/","Sự giải quyết","Dùng khi nói về sự kết thúc của cuộc đàm phán hoặc tranh chấp.","C2"],["Concessions","/kənˈsɛʃənz/","Sự nhượng bộ","Dùng khi nói về các hành động nhượng bộ trong đàm phán.","C2"],["Diplomatic","/ˌdɪpləˈmætɪk/","Ngoại giao","Dùng khi nói về thái độ hoặc hành động liên quan đến đàm phán ngoại giao.","C2"],["Power dynamics","/ˈpaʊə daɪˈnæmɪks/","Động lực quyền lực","Dùng khi nói về sự phân chia quyền lực trong cuộc đàm phán.","C2"],["Arbitration","/ˌɑːbɪˈtreɪʃən/","Trọng tài","Dùng khi nói về quá trình giải quyết tranh chấp thông qua bên thứ ba.","C2"],["Mediation process","/ˌmiːdɪˈeɪʃən ˈprəʊsɛs/","Quá trình hòa giải","Dùng khi nói về các bước trong việc hòa giải tranh chấp.","C2"],["negotiate","/nɪˈɡoʊʃieɪt/","đàm phán","Thảo luận để đạt thỏa thuận.","B1",1],["offer","/ˈɔːfər/","lời đề nghị","Mức giá hoặc điều kiện đưa ra.","A2",1],["agree","/əˈɡriː/","đồng ý","Chấp nhận ý kiến.","A1",1],["win-win","/ˌwɪn ˈwɪn/","đôi bên cùng có lợi","Kết quả tốt cho cả hai bên.","B2",1],["bottom line","/ˌbɑːtəm ˈlaɪn/","giới hạn cuối cùng","Mức thấp nhất có thể chấp nhận.","C1",1],["reach an agreement","/riːtʃ ən əˈɡriːmənt/","đạt được thỏa thuận","Hai bên cùng đồng ý.","B1",1],["That's too expensive","/ðæts tuː ɪkˈspensɪv/","Đắt quá","Câu mặc cả khi mua bán.","A2",1],["Can you do better?","/kæn juː duː ˈbetər/","Bạn bớt thêm được không?","Đề nghị giảm giá thêm.","B1",1],["non-negotiable","/ˌnɑːn nɪˈɡoʊʃiəbl/","không thể thương lượng","Điều không thay đổi được.","C1",1],["leverage","/ˈlevərɪdʒ/","lợi thế đàm phán","Ưu thế để gây ảnh hưởng.","C1",1]]},{"t":"Phỏng vấn và tuyển dụng","w":[["Candidate","/ˈkændɪdət/","Ứng viên","Dùng khi nói về người tham gia vào quá trình phỏng vấn tuyển dụng.","A1"],["Interview","/ˈɪntəvjuː/","Buổi phỏng vấn","Dùng khi nói về cuộc phỏng vấn tuyển dụng.","A2"],["Recruit","/rɪˈkruːt/","Tuyển dụng","Dùng khi nói về hành động tuyển dụng nhân sự.","A2"],["Resume","/rɪˈzeɪm/","Sơ yếu lý lịch","Dùng để chỉ tài liệu mô tả thông tin cá nhân và kinh nghiệm nghề nghiệp.","B1"],["Job offer","/dʒɒb ˈɒfə/","Lời mời làm việc","Dùng khi nói về đề nghị nhận việc từ nhà tuyển dụng.","B1"],["Recruiter","/rɪˈkruːtə/","Người tuyển dụng","Dùng khi nói về người hoặc công ty chuyên thực hiện tuyển dụng.","B1"],["Screening","/ˈskriːnɪŋ/","Sàng lọc ứng viên","Dùng khi nói về quá trình chọn lọc ứng viên từ hồ sơ và phỏng vấn.","B2"],["Qualification","/ˌkwɒlɪfɪˈkeɪʃən/","Trình độ, bằng cấp","Dùng để nói về các tiêu chuẩn hoặc yêu cầu công việc mà ứng viên cần có.","B2"],["Interview panel","/ˈɪntəvjuː ˈpænl/","Ban phỏng vấn","Dùng để nói về nhóm người thực hiện phỏng vấn ứng viên.","B2"],["Applicant","/ˈæplɪkənt/","Người xin việc","Dùng để chỉ những người tham gia vào một quá trình tuyển dụng.","B2"],["References","/ˈrɛfərənsɪz/","Thư giới thiệu hoặc người giới thiệu","Dùng khi nói về người hoặc tài liệu chứng minh kinh nghiệm làm việc của ứng viên.","B2"],["Probation period","/prəˈbeɪʃən ˈpɪərɪəd/","Thời gian thử việc","Dùng khi nói về giai đoạn thử nghiệm trong công việc mới.","B2"],["Skill set","/skɪl sɛt/","Bộ kỹ năng","Dùng để nói về những kỹ năng cụ thể mà ứng viên có trong công việc.","B2"],["Full-time position","/fʊl taɪm pəˈzɪʃən/","Vị trí làm việc toàn thời gian","Dùng khi nói về một công việc không có giờ giấc linh hoạt, yêu cầu làm việc cả ngày.","B2"],["Part-time position","/ˈpɑːt taɪm pəˈzɪʃən/","Vị trí làm việc bán thời gian","Dùng khi nói về công việc có thời gian làm việc không đầy đủ, thường ít giờ hơn.","B2"],["Salary","/ˈsæləri/","Lương","Dùng để chỉ tiền lương mà nhân viên nhận được từ công việc.","B2"],["Benefits","/ˈbɛnɪfɪts/","Phúc lợi","Dùng khi nói về các quyền lợi thêm ngoài lương, như bảo hiểm, ngày nghỉ.","B2"],["Job description","/dʒɒb dɪˈskrɪpʃən/","Mô tả công việc","Dùng để nói về thông tin chi tiết về công việc và các yêu cầu.","B2"],["Onboarding","/ˈɒnbɔːdɪŋ/","Đào tạo hội nhập","Dùng khi nói về quá trình giới thiệu nhân viên mới với công ty và công việc.","B2"],["Talent acquisition","/ˈtælənt ˌækwɪˈzɪʃən/","Thu hút nhân tài","Dùng khi nói về chiến lược tuyển dụng nhân viên có tài năng.","C1"],["Negotiation skills","/nɪˌɡəʊʃiˈeɪʃən skɪlz/","Kỹ năng đàm phán","Dùng khi nói về khả năng thương lượng và đạt được thỏa thuận trong tuyển dụng.","C1"],["Background check","/ˈbækɡraʊnd tʃɛk/","Kiểm tra lý lịch","Dùng khi nói về quá trình kiểm tra thông tin cá nhân của ứng viên.","C1"],["Job satisfaction","/dʒɒb ˌsætɪsˈfækʃən/","Sự hài lòng với công việc","Dùng để nói về mức độ thoải mái và hạnh phúc của nhân viên với công việc của mình.","C1"],["Redundancy","/rɪˈdʌndənsi/","Sự thừa nhân lực, cắt giảm lao động","Dùng khi nói về tình huống công ty phải cắt giảm nhân viên vì lý do tài chính.","C1"],["Outplacement","/ˌaʊtˈpleɪsmənt/","Hỗ trợ tìm việc sau khi bị sa thải","Dùng khi nói về dịch vụ hỗ trợ nhân viên tìm công việc mới sau khi bị sa thải.","C1"],["Performance review","/pəˈfɔːməns rɪˈvjuː/","Đánh giá hiệu suất làm việc","Dùng khi nói về cuộc họp để đánh giá kết quả làm việc của nhân viên.","C1"],["Job market","/dʒɒb ˈmɑːrkɪt/","Thị trường lao động","Dùng khi nói về tình hình tuyển dụng và nhu cầu lao động trên thị trường.","C1"],["Employer brand","/ɪmˈplɔɪə brænd/","Thương hiệu nhà tuyển dụng","Dùng để nói về hình ảnh và danh tiếng của công ty trong mắt ứng viên.","C2"],["Workforce","/ˈwɜːrkfɔːrs/","Lực lượng lao động","Dùng để nói về tổng thể các nhân viên trong một công ty hoặc ngành nghề.","C2"],["Corporate culture","/ˈkɔːpərət ˈkʌltʃər/","Văn hóa doanh nghiệp","Dùng để nói về các giá trị, hành vi và phong cách làm việc của một công ty.","C2"],["CV","/ˌsiː ˈviː/","sơ yếu lý lịch","Hồ sơ xin việc.","A2",1],["apply for","/əˈplaɪ fɔːr/","ứng tuyển","Nộp đơn xin việc.","B1",1],["strength","/streŋθ/","điểm mạnh","Ưu điểm của bản thân.","B1",1],["weakness","/ˈwiːknəs/","điểm yếu","Nhược điểm của bản thân.","B1",1],["salary expectation","/ˈsæləri ˌekspekˈteɪʃn/","mức lương mong muốn","Lương ứng viên mong đợi.","B2",1],["cover letter","/ˈkʌvər ˌletər/","thư xin việc","Thư gửi kèm CV.","B1",1],["work experience","/ˈwɜːrk ɪkˌspɪriəns/","kinh nghiệm làm việc","Những việc đã từng làm.","A2",1],["Tell me about yourself","/tel miː əˈbaʊt jɔːrˈself/","Hãy giới thiệu về bản thân","Câu hỏi mở đầu phỏng vấn.","A2",1],["team player","/ˈtiːm ˌpleɪər/","người làm việc nhóm tốt","Hợp tác tốt với đồng nghiệp.","B2",1],["shortlist","/ˈʃɔːrtlɪst/","danh sách rút gọn","Ứng viên được chọn vào vòng sau.","C1",1]]},{"t":"Lịch sử và địa lý","w":[["History","/ˈhɪstəri/","Lịch sử","Dùng khi nói về quá khứ, sự kiện trong thời gian dài đã qua.","A1"],["Geography","/dʒiˈɒɡrəfi/","Địa lý","Dùng khi nói về các đặc điểm vật lý của Trái đất và các quốc gia.","A1"],["Continent","/ˈkɒntɪnənt/","Châu lục","Dùng khi nói về một trong các đại lục trên thế giới.","A2"],["Capital","/ˈkæpɪtl/","Thủ đô","Dùng khi nói về thành phố là trung tâm chính trị, hành chính.","A2"],["Climate","/ˈklaɪmət/","Khí hậu","Dùng khi nói về điều kiện thời tiết trong một khu vực lớn.","A2"],["Landmark","/ˈlændmɑːrk/","Địa danh","Dùng khi nói về các công trình nổi bật và quan trọng trong lịch sử hoặc địa lý.","B1"],["Heritage","/ˈhɛrɪtɪdʒ/","Di sản","Dùng khi nói về những giá trị văn hóa, lịch sử truyền lại từ thế hệ trước.","B1"],["Tradition","/trəˈdɪʃən/","Truyền thống","Dùng khi nói về các phong tục tập quán, hành vi qua nhiều thế hệ.","B1"],["Civilization","/ˌsɪvɪlaɪˈzeɪʃən/","Nền văn minh","Dùng khi nói về một xã hội phát triển cao với nền tảng văn hóa và xã hội phức tạp.","B1"],["Empire","/ˈɛmpaɪə/","Đế chế","Dùng khi nói về một quốc gia hoặc lãnh thổ rộng lớn, thường được điều hành bởi một hoàng đế.","B1"],["Revolution","/ˌrɛvəˈluːʃən/","Cách mạng","Dùng khi nói về sự thay đổi lớn trong chính trị hoặc xã hội.","B2"],["Landmark","/ˈlændmɑːrk/","Địa danh, biểu tượng","Dùng khi nói về những nơi, công trình đặc trưng.","B2"],["Ancient","/ˈeɪnʃənt/","Cổ đại","Dùng khi nói về các nền văn minh hoặc sự kiện xảy ra rất lâu trước đây.","B2"],["Exploration","/ˌɛkspləˈreɪʃən/","Khám phá","Dùng khi nói về hành động khám phá các vùng đất mới hoặc tìm hiểu về thế giới.","B2"],["Geography","/dʒiˈɒɡrəfi/","Địa lý","Dùng khi nói về nghiên cứu về các yếu tố tự nhiên của Trái đất.","B2"],["Coastline","/ˈkəʊstlaɪn/","Đường bờ biển","Dùng khi nói về đường viền của đất liền tiếp xúc với biển.","B2"],["Peninsula","/pəˈnɪnsjʊlə/","Bán đảo","Dùng khi nói về một vùng đất nhô ra biển nhưng vẫn nối với đất liền.","B2"],["Desert","/ˈdɛzət/","Sa mạc","Dùng khi nói về vùng đất khô cằn, ít mưa và nhiệt độ cao.","B2"],["River basin","/ˈrɪvə ˈbeɪsən/","Lưu vực sông","Dùng khi nói về vùng đất mà nước sông chảy qua và thoát ra biển.","B2"],["Plateau","/ˈplæteɪəʊ/","Cao nguyên","Dùng khi nói về một vùng đất bằng phẳng nhưng có độ cao lớn hơn so với khu vực xung quanh.","B2"],["Civilization","/ˌsɪvɪlaɪˈzeɪʃən/","Nền văn minh","Dùng khi nói về một nền văn hóa phát triển trong một khu vực lớn.","B2"],["Revolution","/ˌrɛvəˈluːʃən/","Cách mạng","Dùng khi nói về sự thay đổi lớn trong xã hội hoặc chính trị.","B2"],["Geography","/dʒiˈɒɡrəfi/","Địa lý","Dùng khi nói về các đặc điểm và cấu trúc của hành tinh.","B2"],["Empire","/ˈɛmpaɪə/","Đế chế","Dùng khi nói về một quốc gia hoặc lãnh thổ rộng lớn, thường được điều hành bởi một hoàng đế.","C1"],["Archaeology","/ˌɑːkiˈɒlədʒi/","Khảo cổ học","Dùng khi nói về việc nghiên cứu lịch sử qua các hiện vật vật lý.","C1"],["Civilization","/ˌsɪvɪlaɪˈzeɪʃən/","Nền văn minh","Dùng khi nói về một xã hội phát triển với các yếu tố văn hóa và xã hội.","C1"],["Empire","/ˈɛmpaɪə/","Đế chế","Dùng khi nói về sự thống trị của một quốc gia rộng lớn.","C1"],["Ancient","/ˈeɪnʃənt/","Cổ xưa","Dùng khi nói về những nền văn minh const LS="lnhn-state-v1";
const dkey=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const DAY=864e5;
function fresh(){return{v:1,updatedAt:0,settings:{goal:50,newPerDay:8,rate:.95,rv2:1,voice:"buttery",level:"B1"},cards:{},custom:[],log:{},shadow:{},conv:{},newDay:{d:"",n:0},topic:"all"}}
let S=fresh();
try{const raw=localStorage.getItem(LS);if(raw)S=Object.assign(fresh(),JSON.parse(raw));S.settings=Object.assign(fresh().settings,S.settings)}catch(e){}
function migV(){if(!S.settings.rv2){if(S.settings.rate==1)S.settings.rate=.95;S.settings.rv2=1}}migV();
let dbRef=null,saveT=null;
function save(){S.updatedAt=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  clearTimeout(saveT);saveT=setTimeout(()=>{if(dbRef)dbRef.set({json:JSON.stringify(S),updatedAt:S.updatedAt}).catch(()=>{})},1200)}
function today(){const k=dkey();return S.log[k]||(S.log[k]={xp:0,rev:0,shadow:0,conv:0})}
function addXp(n,kind){const t=today();t.xp+=n;if(kind)t[kind]=(t[kind]||0)+1;save();hdr()}
function streak(){let n=0,d=new Date();if(!(S.log[dkey(d)]?.xp>0))d=new Date(d-DAY);while(S.log[dkey(d)]?.xp>0){n++;d=new Date(d-DAY)}return n}
function allCards(){return SEED.concat(S.custom)}

/* SM-2 style scheduling (Anki) */
function due(){const now=Date.now();return allCards().filter(c=>S.cards[c.id]&&S.cards[c.id].due<=now&&(S.topic==="all"||c.topic===S.topic))}
function newLeft(){if(S.newDay.d!==dkey())S.newDay={d:dkey(),n:0};return Math.max(0,S.settings.newPerDay-S.newDay.n)}
function newCards(){return allCards().filter(c=>!S.cards[c.id]&&(S.topic==="all"||c.topic===S.topic))}
function queue(){const d=due();const n=newCards().slice(0,newLeft());return d.concat(n)}
function preview(c,g){const s=S.cards[c.id]||{ease:2.5,ivl:0,reps:0};
  if(g===0)return 10*60e3;let ivl;
  if(s.reps===0)ivl=g===1?1:g===2?1:4;else if(s.reps===1)ivl=g===1?3:g===2?6:8;else ivl=Math.round(s.ivl*(g===1?1.2:g===2?s.ease:s.ease*1.3));
  return ivl*DAY}
function fmt(ms){if(ms<DAY)return Math.round(ms/60e3)+" phút";const d=Math.round(ms/DAY);return d<30?d+" ngày":Math.round(d/30)+" tháng"}
function grade(c,g){const isNew=!S.cards[c.id];const s=S.cards[c.id]||{ease:2.5,ivl:0,reps:0,lapses:0};const ms=preview(c,g);
  if(g===0){s.reps=0;s.lapses++;s.ease=Math.max(1.3,s.ease-.2);s.ivl=0}
  else{s.ivl=ms/DAY;s.reps++;s.ease=Math.max(1.3,s.ease+(g===1?-.15:g===3?.15:0))}
  s.due=Date.now()+ms;S.cards[c.id]=s;if(isNew){newLeft();S.newDay.n++}addXp(g===0?1:2,"rev")}
function learnedCount(){return Object.values(S.cards).filter(s=>s.ivl>=6).length}

let TTS=null,DICT=null,SAMPLE=null;
function splitSent(t){return String(t).replace(/\s+/g," ").trim().match(/[^.!?…]+[.!?…]+["')\]]*|[^.!?…]+$/g)?.map(x=>x.trim()).filter(Boolean)||[String(t)]}
function speak(text,slow){const rate=(slow?.8:1)*S.settings.rate;
  if(TTS){const parts=splitSent(text);TTS.speak(parts.length>1?parts.map(x=>({text:x,language:"en"})):text,{voice:S.settings.voice,rate:Math.min(1.5,Math.max(.7,rate)),language:"en"}).catch(()=>browserSpeak(text,rate));return}
  browserSpeak(text,rate)}
let VOICES=[];
const BAD_V=/compact|bad news|bells|boing|bubbles|cellos|whisper|zarvox|trinoids|wobble|jester|organ|superstar|albert|bahh|fred|junior|ralph|kathy|good news|hysterical|deranged|pipe organ|grandma|grandpa|eddy|flo|reed|rocko|sandy|shelley/i;
function voiceScore(v){let s=0;const n=v.name.toLowerCase();
 if(/^en[-_]us/i.test(v.lang))s+=30;else if(/^en[-_]gb/i.test(v.lang))s+=26;else if(/^en[-_](au|ca|ie|nz)/i.test(v.lang))s+=18;else if(/^en/i.test(v.lang))s+=10;else return -1;
 if(/natural|neural|enhanced|premium|online/.test(n))s+=40;
 if(/google us english|google uk english female/.test(n))s+=30;else if(/google/.test(n))s+=22;
 if(/samantha|ava|allison|susan|serena|evan|nathan|zoe|karen|daniel|moira|tessa|aria|jenny|guy|libby|sonia|ryan|emma|brian|ana|christopher|michelle|eric|steffan/.test(n))s+=15;
 if(/microsoft (david|zira|mark|hazel|george)/.test(n))s+=5;
 if(BAD_V.test(n))s-=60;return s}
function loadVoices(){try{VOICES=speechSynthesis.getVoices().filter(v=>voiceScore(v)>=0).sort((a,b)=>voiceScore(b)-voiceScore(a))}catch(e){VOICES=[]}return VOICES}
try{loadVoices();speechSynthesis.addEventListener("voiceschanged",()=>{loadVoices();if(TAB==="stats"&&!TTS&&$("#sBVoice")&&$("#sBVoice").options.length<2)render()})}catch(e){}
function bestVoice(){if(!VOICES.length)loadVoices();const pick=S.settings.bvoice&&VOICES.find(v=>v.voiceURI===S.settings.bvoice);return pick||VOICES[0]||null}
function browserSpeak(text,rate){try{const v=bestVoice();speechSynthesis.cancel();
  const parts=splitSent(text);parts.forEach((x,i)=>{const u=new SpeechSynthesisUtterance(x);u.lang=v?v.lang:"en-US";if(v)u.voice=v;u.rate=Math.min(1.4,Math.max(.6,rate));u.pitch=1;u.volume=1;speechSynthesis.speak(u)});
  if(speechSynthesis.paused)speechSynthesis.resume()}catch(e){toast("Thiết bị này chưa đọc được âm thanh")}}
let micTarget=null,micBuf="",micBtn=null,micSegs=[];
function startMic(target,btn){if(!DICT){toast("Micro chỉ có trên Chrome/Edge hoặc app Claude máy tính. Bạn có thể gõ thay thế.");return}
  if(DICT.active()){DICT.stop().catch(()=>{});return}
  micTarget=target;micBuf="";micSegs=[];micBtn=btn;
  DICT.start({language:"en-US"}).catch(e=>{btn&&btn.classList.remove("on");if(e&&e.code==="not_granted")toast("Bạn chưa cho phép micro");else if(e&&e.code==="offline")toast("Chấm phát âm bằng micro cần mạng. Khi offline, hãy gõ lại câu để tự kiểm tra.");else if(e&&e.code!=="dismissed")toast("Không bật được micro, thử lại nhé")});}
function wireDict(){DICT.onPartial(({text})=>micTarget&&micTarget.partial&&micTarget.partial((micBuf+" "+text).trim()));
  DICT.onFinal(({text,alts})=>{micBuf=(micBuf+" "+text).trim();micSegs.push(alts&&alts.length?alts:[text]);micTarget&&micTarget.partial&&micTarget.partial(micBuf)});
  DICT.onState(({state})=>{if(micBtn)micBtn.classList.toggle("on",state==="listening"||state==="starting");
    if(state==="idle"&&micTarget){const t=micTarget;micTarget=null;t.done&&t.done(micBuf,micSegs.slice())}})}
